name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitcv
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build API and check migrations apply cleanly
        run: |
          npm run build -w @fitcv/api
          npm run db:migrate -w @fitcv/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitcv
      - name: Build web
        run: npm run build -w @fitcv/web
        env:
          API_URL: http://localhost:4000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
